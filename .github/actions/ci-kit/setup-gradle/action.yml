name: setup-gradle
description: Temurin JDK plus Gradle with dependency and wrapper caches.
inputs:
  java-version:
    description: JDK major version.
    default: "21"
  distribution:
    description: JDK distribution for setup-java.
    default: "temurin"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
