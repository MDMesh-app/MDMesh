name: setup-npm
description: Node from package.json engines (or explicit version), npm cache keyed on package-lock.json, `npm ci`.
inputs:
  node-version:
    description: Node version. Empty means read package.json via node-version-file.
    default: ""
  install:
    description: Run `npm ci`.
    default: "true"
  working-directory:
    description: Directory containing package.json and package-lock.json.
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && format('{0}/package.json', inputs.working-directory) || '' }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
