# Weekly dependency PRs, grouped per ecosystem so a routine week is one PR per plane, not fifteen.
# Security updates are independent of this schedule (repo setting: Dependabot security updates = on).
#
# Policy (CONTRIBUTING.md "Dependency updates"): every `ignore` below names a line we cannot take without a
# deliberate migration, and says which migration lifts it. Delete the ignore in the same PR as that migration.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      server-maven: { patterns: ["*"] }
    open-pull-requests-limit: 5
    ignore:
      # javax -> jakarta namespace (Servlet/JAX-RS/JMS/inject). The server is javax.* on Tomcat 9; these lines
      # need the Tomcat 10+ / jakarta migration. Jersey >= 2.26 also replaces the HK2/guice-bridge wiring and
      # moves org.glassfish.jersey.jaxb.internal (ApplicationDAO) - so the JAX-RS 2.1 API moves with it.
      - dependency-name: "org.glassfish.jersey*"
        versions: ["[2.26,)"]
      - dependency-name: "org.glassfish.hk2:*"
        versions: ["[3,)"]
      - dependency-name: "javax.ws.rs:javax.ws.rs-api"
        versions: ["[2.1,)"]
      - dependency-name: "org.mybatis:mybatis-guice"
        versions: ["[4,)"]
      - dependency-name: "org.apache.activemq:*"
        versions: ["[6,)"]
      # JAXB 2.2.11 api/core/impl move as one family; 2.3.x folds core into impl (duplicate classes if mixed)
      # and 3+/4+ are jakarta. Modernise by hand to org.glassfish.jaxb:jaxb-runtime in one change.
      - dependency-name: "com.sun.xml.bind:*"
      - dependency-name: "javax.xml.bind:jaxb-api"
      # jjwt 0.10+ rewrote the API (TokenProvider no longer compiles); needs a jwt-module port.
      - dependency-name: "io.jsonwebtoken:*"
        versions: ["[0.10,)"]
      # Liquibase 5.x is FSL-1.1 (not Apache-2.0) - blocked by ADR-0008's license obligations.
      - dependency-name: "org.liquibase:*"
        versions: ["[5,)"]
      # qrgen 2.6+ and 3.x pull a batik/xml-apis-ext transitive that JitPack serves as an empty jar,
      # breaking the server compile (#37's red run). Revisit together with dropping the JitPack repository.
      - dependency-name: "com.github.kenglxn.qrgen:*"
        versions: ["[2.6,)"]
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday }
    groups:
      web-npm: { patterns: ["*"] }
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node runtime line (package.json engines / docker node:<line>-alpine), which is
      # changed by hand per the Node policy - not to whatever the newest types major is.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: "/agent-android"
    schedule: { interval: weekly, day: monday }
    groups:
      # The coupled toolchain train: AGP 9 / Gradle 9 (wrapper) / Kotlin 2.4 / KSP2 / Hilt 2.60 plus the libraries
      # whose current releases need it (Kotlin 2.3+ metadata, AGP >= 9.1, compileSdk 37). This PR is expected to
      # stay red until the agent AGP-9 migration lands; do not merge it piecemeal. First matching group wins.
      agent-toolchain:
        patterns:
          - "gradle-wrapper"
          - "com.android.application*"
          - "com.android.library*"
          # Also matches org.jetbrains.kotlinx:* (coroutines, serialization) on purpose: their current releases need
          # Kotlin 2.3+ metadata, so they move with the Kotlin compiler, not in agent-libs.
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
          - "androidx.hilt*"
          - "androidx.core*"
          - "com.squareup.okhttp3*"
          # detekt 1.23.x is built against Kotlin 2.0 and its Gradle plugin refuses a newer Kotlin, so it has to move
          # with Kotlin (in the migration: detekt 2.x, whose plugin id is dev.detekt) or T0's agent step breaks.
          - "io.gitlab.arturbosch.detekt*"
      agent-libs: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    # .github/actions/ci-kit/ is vendored from init-lunacy/ci-kit (see its VENDORED.txt) and is only ever
    # changed by re-running that kit's scripts/vendor.sh - Dependabot does not scan it (directory "/" only).
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly, day: monday }
    groups:
      docker-images: { patterns: ["*"] }
    ignore:
      # Base images use floating tags, so patch/security rebuilds come from the registry on every image build.
      # Exception: caddy (docker/web.Dockerfile, the edge) is pinned to an exact release because a Caddy release can
      # change how docker/Caddyfile parses. It is deliberately NOT ignored: each release arrives in this group's PR,
      # and T0's `edge` job (scripts/edge-check.sh) validates the Caddyfile in every hosting mode against it.
      # For the floating tags, a tag change is a platform decision, never a routine bump:
      # tomcat >= 10 is jakarta.* (server is javax.*); the JDK line is chosen with the runtime (see CONTRIBUTING.md).
      - dependency-name: "tomcat"
        versions: [">= 10"]
      - dependency-name: "maven"
      # Node lines move by hand to the current *LTS* line (Dependabot cannot select LTS-only).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images: { patterns: ["*"] }
    # Scans docker-compose*.yml. Our own ghcr.io/.../mdmesh-* images use ${VAR:-latest} tags and are skipped;
    # cloudflared is :latest (nothing to bump).
    ignore:
      # Postgres stays on 14.x: a new major cannot open an existing 14 data directory (dump/restore or
      # pg_upgrade). Move it only in a planned database migration.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
