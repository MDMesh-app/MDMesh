# Weekly dependency PRs, grouped per ecosystem so a routine week is one PR per plane, not fifteen.
# Security updates are independent of this schedule (repo setting: Dependabot security updates = on).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      server-maven: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday }
    groups:
      web-npm: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/supervisor"
    schedule: { interval: weekly, day: monday }
    groups:
      supervisor-npm: { patterns: ["*"] }
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: "/agent-android"
    schedule: { interval: weekly, day: monday }
    groups:
      agent-gradle: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly, day: monday }
