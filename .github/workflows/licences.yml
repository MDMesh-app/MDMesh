# Licences (docs/licenses/policy.md). The server, console and agent builds check their own third-party components
# against docs/licenses/allowed.txt wherever CI is set, and T0's server, web and agent entries run
# scripts/licenses/inventory.py on what they built, on a dependency or a licence policy change too. This workflow checks
# what no single build sees, on every change:
#   tools      every file kept from Headwind MDM that MDMesh changed says so, and keeps the upstream header
#              (scripts/licenses/headers.py, docs/licenses/upstream-files.tsv); and the licence scripts' own tests
#              (fails)
#   images     every image and package docker/*.Dockerfile uses is named in docs/licenses/images.md (fails)
name: licences

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tools:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Change notices on the files kept from upstream
        run: scripts/licenses/headers.py check
      - name: The licence scripts' own tests
        run: |
          tests/licenses/headers-test.sh
          tests/licenses/inventory-test.sh
          tests/licenses/image-packages-test.sh

  images:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The images' base images and packages are in docs/licenses/images.md
        run: scripts/licenses/check-images.sh
