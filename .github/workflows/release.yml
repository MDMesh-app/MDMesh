name: release

# Cut a release:  git tag v1.2.3 && git push --tags
# Produces a tested, signed GitHub Release: the release APK, server+web images on GHCR, and a
# minisign-signed manifest the fleet updater consumes. Requires repo secrets (see RELEASING.md):
# MDM_RELEASE_STORE_B64, MDM_RELEASE_STORE_PASSWORD, MDM_RELEASE_KEY_ALIAS, MDM_RELEASE_KEY_PASSWORD,
# MINISIGN_SECRET_KEY, MINISIGN_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Per-run local tag for the smoked supervisor build (never pushed under this name): unique so a shared
      # daemon can't swap in another run's image between the smoke and the push that retags it.
      SUP_IMG: mdmesh-supervisor:smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      # Validate the tag as strict semver FIRST — the tag name is attacker-influencable input, and
      # this guarantees VERSION is [0-9.] only before it ever reaches a shell/gradle/docker arg.
      - name: Derive + validate versions
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vMAJOR.MINOR.PATCH (got '$REF_NAME')"; exit 1; }
          {
            echo "version=$V"
            echo "code=$(release/version.sh "$V")"
            echo "proto=$(grep -oP 'PROTOCOL_VERSION[^\"]*\"\K[^\"]+' agent-android/proto/src/main/kotlin/com/mdmesh/proto/ProtocolJson.kt)"
          } >> "$GITHUB_OUTPUT"

      # Supervisor smoke BEFORE anything is built or pushed (#27): a supervisor that can't start the way
      # compose runs it must never reach GHCR. The Supervisor image step below pushes this very $SUP_IMG
      # build. (No step before the final "Move :latest" step touches :latest.)
      - name: Supervisor image smoke (compose-shaped)
        run: |
          docker build -f docker/supervisor.Dockerfile -t "$SUP_IMG" .
          docker run --rm -w /app "$SUP_IMG" node --test test.js
          scripts/supervisor-smoke.sh "$SUP_IMG"

      # --- Build + sign the release APK (gated by unit tests + R8 lintVital) ---
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # Default is "tools platform-tools"; Google removed the legacy "tools" package from the
          # SDK repository (Sept 2026) so sdkmanager exits 1. AGP auto-provisions platforms/build-tools.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
      - name: Decode release keystore
        env:
          STORE_B64: ${{ secrets.MDM_RELEASE_STORE_B64 }}
        run: printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test + assemble signed release
        working-directory: agent-android
        env:
          MDM_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          MDM_RELEASE_STORE_PASSWORD: ${{ secrets.MDM_RELEASE_STORE_PASSWORD }}
          MDM_RELEASE_KEY_ALIAS: ${{ secrets.MDM_RELEASE_KEY_ALIAS }}
          MDM_RELEASE_KEY_PASSWORD: ${{ secrets.MDM_RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          gradle --no-daemon :proto:test :core:test :app:assembleRelease \
            -PmdmBaseUrl=https://mdm.example.com/ \
            -PversionName="$VERSION" -PversionCode="$CODE"
      - name: Stage APK + compute checksum
        run: |
          cp agent-android/app/build/outputs/apk/release/app-release.apk mdmesh-agent.apk
          CK=$(release/apk-checksum.sh mdmesh-agent.apk)
          [ -n "$CK" ] || { echo "APK signature checksum came out empty — aborting the release"; exit 1; }
          echo "CK=$CK" >> "$GITHUB_ENV"

      # --- Build + push images to GHCR (:VERSION only; :latest moves in the last step) ---
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')   # GHCR repo names must be lowercase
          IMG="ghcr.io/${O}/mdmesh-server"
          docker build -f docker/server.Dockerfile -t "$IMG:$VERSION" .
          docker push "$IMG:$VERSION"
          echo "SERVER_IMG=$IMG:$VERSION" >> "$GITHUB_ENV"
      - name: Web image (bake release QR checksum/package)
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${O}/mdmesh-web"
          docker build -f docker/web.Dockerfile \
            --build-arg VITE_AGENT_PACKAGE=com.mdmesh.agent \
            --build-arg VITE_AGENT_CHECKSUM="$CK" \
            --build-arg VITE_AGENT_APK_URL=/files/agent.apk \
            --build-arg VITE_APP_VERSION="$VERSION" \
            -t "$IMG:$VERSION" .
          docker push "$IMG:$VERSION"
          echo "WEB_IMG=$IMG:$VERSION" >> "$GITHUB_ENV"
      - name: Supervisor image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${O}/mdmesh-supervisor"
          # Publish exactly the image the smoke step tested (no rebuild).
          docker tag "$SUP_IMG" "$IMG:$VERSION"
          docker push "$IMG:$VERSION"
      - name: Verify images are publicly pullable (guards against private GHCR packages, #3)
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          fail=0
          for img in mdmesh-server mdmesh-web mdmesh-supervisor; do
            # No credentials on purpose: this is exactly what the quickstart does on a fresh box.
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${O}/${img}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${O}/${img}/manifests/${VERSION}")
            echo "${img}:${VERSION} anonymous manifest -> ${code}"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = 1 ]; then
            echo "::error::At least one image is not anonymously pullable. Set the package visibility to Public" \
                 "(org → Packages → <image> → Package settings → Danger Zone) and re-run this job."
            exit 1
          fi

      # --- Manifest: build + sign ---
      - name: Build + sign manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          PROTO: ${{ steps.ver.outputs.proto }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y minisign
          release/build-manifest.sh "$VERSION" stable \
            "$SERVER_IMG" "$WEB_IMG" mdmesh-agent.apk "$CODE" "$CK" "$PROTO"
          release/sign-manifest.sh manifest.json

      # --- Publish ---
      - name: Release notes from the tag annotation
        run: |
          git fetch --tags --force --quiet
          { git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d'; } > release-notes.md
          [ -s release-notes.md ] || echo "See the commit history for this release." > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            mdmesh-agent.apk
            manifest.json
            manifest.json.minisig

      # --- Move :latest LAST, only once the release is pullable, signed and published ---
      # Quick-start installs (*_VERSION=latest, `docker compose pull`) follow :latest, so it must never point
      # at an image whose release failed. Retag registry-side from the already-pushed :VERSION (no rebuild, no
      # local state). --prefer-index=false is required: buildx defaults to wrapping a single image manifest in a
      # NEW index, which would give :latest a different digest from :VERSION. With it, the source manifest is
      # re-pushed as-is, so both tags share one digest — asserted below. Phased to keep a failure as early and
      # as all-or-nothing as possible: resolve all three :VERSION first, then move all three, then verify all.
      # A red job here leaves the Release published; recover by hand (RELEASING.md), don't re-run the job.
      - name: Move :latest to this release
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMGS="mdmesh-server mdmesh-web mdmesh-supervisor"
          digest() { docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"; }
          declare -A want
          for img in $IMGS; do
            d=$(digest "ghcr.io/${O}/${img}:${VERSION}") || d=""
            [ -n "$d" ] || { echo "::error::cannot resolve ghcr.io/${O}/${img}:${VERSION}; no :latest was moved"; exit 1; }
            want[$img]=$d
          done
          for img in $IMGS; do
            docker buildx imagetools create --prefer-index=false \
              --tag "ghcr.io/${O}/${img}:latest" "ghcr.io/${O}/${img}:${VERSION}"
          done
          bad=0
          for img in $IMGS; do
            got=$(digest "ghcr.io/${O}/${img}:latest") || got=""
            echo "${img}: :${VERSION}=${want[$img]} :latest=${got}"
            if [ "$got" != "${want[$img]}" ]; then
              echo "::error::${img}:latest is '${got}', expected :${VERSION} digest '${want[$img]}'"; bad=1
            fi
          done
          [ "$bad" = 0 ]
