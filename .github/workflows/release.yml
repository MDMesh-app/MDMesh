name: release

# Cut a release: tag the release PR's merge commit with its CHANGELOG.md section, then push the tag (RELEASING.md):
#   n=$(release/changelog-section.sh 1.2.3) && git tag -a v1.2.3 --cleanup=whitespace -m "$n" SHA
#   release/changelog-section.sh --check v1.2.3 SHA && git push origin v1.2.3
# Produces a tested, signed GitHub Release: the release APK, quickstart.sh, the server, web and supervisor images on
# GHCR (linux/amd64 + linux/arm64), and a minisign-signed manifest the fleet updater and the quick start consume.
# Requires these `release` environment secrets (see RELEASING.md): MDM_RELEASE_STORE_B64, MDM_RELEASE_STORE_PASSWORD,
# MDM_RELEASE_KEY_ALIAS, MDM_RELEASE_KEY_PASSWORD, MINISIGN_SECRET_KEY, MINISIGN_PASSWORD.
#
# Jobs: gate → apk (signed APK) → images (each image on each platform, pushed by digest) → publish (tags, signed
# manifest, GitHub Release, :latest).
# Who may release: the `gate` job (no secrets, read-only token) refuses a tag whose commit is not on main. The `apk` and
# `publish` jobs, which alone hold the signing secrets, run in the `release` environment: each waits for a required
# reviewer, and the secrets live there as environment secrets, so a workflow edited on an unmerged commit can't reach
# them without that approval. `images` (a package write token, no secrets) runs only after the approved `apk` job, and
# what it pushes stays untagged until `publish`. Repo settings this relies on are listed in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # every branch with full history (origin/main included), for the ancestry check
          persist-credentials: false
      - name: Tagged commit is on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::origin/main was not fetched; cannot check where ${REF_NAME} points"; exit 1; }
          # First-parent: a commit main itself pointed at (a merge result or a direct commit), not one from inside a
          # merged branch.
          if ! git rev-list --first-parent origin/main | grep -qx "$commit"; then
            echo "::error::Tag ${REF_NAME} points at ${commit}, which is not on main's first-parent history. Releases are cut from main only."
            exit 1
          fi
          echo "${REF_NAME} -> ${commit} is on main"
      - name: Version is newer than every earlier release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag must be vMAJOR.MINOR.PATCH (got '$REF_NAME')"; exit 1; }
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$REF_NAME" | sort -V | tail -n 1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$REF_NAME" | sort -V | tail -n 1)" != "$REF_NAME" ]; then
            echo "::error::${REF_NAME} is not newer than the latest release tag ${latest}."
            exit 1
          fi
          echo "${REF_NAME} is newer than ${latest:-(no earlier release)}"
      # The annotation becomes the release notes (release job), so it must be this version's CHANGELOG.md section as
      # `release/changelog-section.sh X.Y.Z` prints it from the tagged commit (RELEASING.md), and the tag must still
      # point at the commit this run checked out. Checkout can leave the tag lightweight, so fetch the annotated tag
      # first. REF_NAME was validated as vX.Y.Z above. The release job repeats this check twice.
      - name: Tag annotation matches CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --quiet origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          release/changelog-section.sh --check "$REF_NAME" "$GITHUB_SHA" \
            || { echo "::error::${REF_NAME} is not its CHANGELOG.md section on ${GITHUB_SHA} (details above; RELEASING.md)"; exit 1; }

  # The signed release APK. Its signing checksum goes into the web image (the enrollment QR), so it comes first.
  apk:
    needs: gate
    # Required reviewers + the signing secrets live on this environment (RELEASING.md): the run's first approval.
    environment: release
    # Pinned, not ubuntu-latest: a tag push must not silently change OS (ubuntu-latest moves to 26.04 on
    # 2026-10-19). T0 stays on ubuntu-latest and is the canary; bump this (and the images and publish jobs') after T0
    # is green on the new image.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
      proto: ${{ steps.ver.outputs.proto }}
      ck: ${{ steps.ck.outputs.ck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Validate the tag as strict semver FIRST — the tag name is attacker-influencable input, and
      # this guarantees VERSION is [0-9.] only before it ever reaches a shell/gradle/docker arg.
      - name: Derive + validate versions
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vMAJOR.MINOR.PATCH (got '$REF_NAME')"; exit 1; }
          {
            echo "version=$V"
            echo "code=$(release/version.sh "$V")"
            echo "proto=$(grep -oP 'PROTOCOL_VERSION[^\"]*\"\K[^\"]+' agent-android/proto/src/main/kotlin/com/mdmesh/proto/ProtocolJson.kt)"
          } >> "$GITHUB_OUTPUT"
      # Same check as the gate's: approval can come hours later, and the tag could have been moved or re-annotated since.
      - name: Tag still matches this commit and CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --quiet origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          release/changelog-section.sh --check "$REF_NAME" "$GITHUB_SHA" \
            || { echo "::error::${REF_NAME} is not its CHANGELOG.md section on ${GITHUB_SHA} (details above; RELEASING.md)"; exit 1; }

      # --- Build + sign the release APK (gated by unit tests + R8 lintVital) ---
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          # Default is "tools platform-tools"; Google removed the legacy "tools" package from the
          # SDK repository (Sept 2026) so sdkmanager exits 1. AGP auto-provisions platforms/build-tools.
          packages: platform-tools
      # Same JDK + Gradle setup as T0's agent job; the committed wrapper (not a pinned Gradle) builds the APK,
      # so a wrapper bump is proven by T0 before it ever reaches a release.
      - uses: ./.github/actions/ci-kit/setup-gradle
        with:
          java-version: "17"
      - name: Decode release keystore
        env:
          STORE_B64: ${{ secrets.MDM_RELEASE_STORE_B64 }}
        run: printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test + assemble signed release
        working-directory: agent-android
        env:
          MDM_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          MDM_RELEASE_STORE_PASSWORD: ${{ secrets.MDM_RELEASE_STORE_PASSWORD }}
          MDM_RELEASE_KEY_ALIAS: ${{ secrets.MDM_RELEASE_KEY_ALIAS }}
          MDM_RELEASE_KEY_PASSWORD: ${{ secrets.MDM_RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          ./gradlew --no-daemon :proto:test :core:test :app:assembleRelease \
            -PmdmBaseUrl=https://mdm.example.com/ \
            -PversionName="$VERSION" -PversionCode="$CODE"
      - name: Stage APK + compute checksum
        id: ck
        run: |
          cp agent-android/app/build/outputs/apk/release/app-release.apk mdmesh-agent.apk
          CK=$(release/apk-checksum.sh mdmesh-agent.apk)
          [ -n "$CK" ] || { echo "APK signature checksum came out empty — aborting the release"; exit 1; }
          echo "ck=$CK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-apk
          path: mdmesh-agent.apk
          if-no-files-found: error

  # --- The server, web and supervisor images, for linux/amd64 and linux/arm64 ---
  # Each platform is built on its own GitHub runner (x86_64, and the native Arm64 one: no emulation) and pushed by
  # digest only, untagged; nothing pulls an untagged image. The publish job joins each image's two digests into one
  # multi-platform index under :VERSION, and only once every build here passed. No secrets: this job runs only after
  # the approved apk job, from the same tagged workflow.
  images:
    needs: apk
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web, supervisor]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A docker-container builder: the runner's default (docker) builder can't push by digest. BuildKit pinned for the
      # same reason as runs-on. No provenance or SBOM attestations: they would add "unknown/unknown" entries to the index.
      # The web image bakes the release APK's package + signing checksum into its enrollment QR, and its version.
      - name: Build + push ${{ matrix.image }} for linux/${{ matrix.arch }} by digest
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.apk.outputs.version }}
          CK: ${{ needs.apk.outputs.ck }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')   # GHCR repo names must be lowercase
          REPO="ghcr.io/${O}/mdmesh-${IMAGE}"
          args=()
          if [ "$IMAGE" = web ]; then
            args=(--build-arg VITE_AGENT_PACKAGE=com.mdmesh.agent --build-arg VITE_AGENT_CHECKSUM="$CK"
                  --build-arg VITE_AGENT_APK_URL=/files/agent.apk --build-arg VITE_APP_VERSION="$VERSION")
          fi
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          docker buildx build -f "docker/${IMAGE}.Dockerfile" --platform "linux/${ARCH}" "${args[@]}" \
            --provenance=false --sbom=false --metadata-file "$RUNNER_TEMP/build.json" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" .
          D=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("containerimage.digest", ""))' "$RUNNER_TEMP/build.json")
          echo "$D" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::no digest for ${IMAGE} linux/${ARCH} (got '${D}')"; exit 1; }
          echo "ref=${REPO}@${D}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/digest" && printf '%s\n' "$D" > "$RUNNER_TEMP/digest/${IMAGE}-${ARCH}"
      # Supervisor smoke on each platform, against exactly the pushed image (#27): a supervisor that can't start the way
      # compose runs it must never get a tag. A failure here stops the release before the publish job tags anything.
      - if: matrix.image == 'supervisor'
        name: Supervisor smoke (compose-shaped), linux/${{ matrix.arch }}
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          docker pull --quiet "$REF"
          docker run --rm -w /app "$REF" node --test test.js
          scripts/supervisor-smoke.sh "$REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.image }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [apk, images]
    # The minisign secrets live on this environment too: the run's second approval (RELEASING.md).
    environment: release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.apk.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Again: the second approval can come hours after the first.
      - name: Tag still matches this commit and CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --quiet origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          release/changelog-section.sh --check "$REF_NAME" "$GITHUB_SHA" \
            || { echo "::error::${REF_NAME} is not its CHANGELOG.md section on ${GITHUB_SHA} (details above; RELEASING.md)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: agent-apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      # --- Tag the images on GHCR as :VERSION (:latest moves in the last step) ---
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One index per image, holding its linux/amd64 and linux/arm64 builds; docker pulls the host's platform from it.
      # The manifest pins each index by the digest read back from GHCR (image-digest.sh, which also refuses an index
      # without exactly one image per platform).
      - name: Join each image's platforms under :VERSION
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for img in server web supervisor; do
            REPO="ghcr.io/${O}/mdmesh-${img}"
            srcs=()
            for arch in amd64 arm64; do
              d=$(cat "$RUNNER_TEMP/digest/${img}-${arch}")
              echo "$d" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::no digest for ${img} linux/${arch}"; exit 1; }
              srcs+=("${REPO}@${d}")
            done
            docker buildx imagetools create --tag "${REPO}:${VERSION}" "${srcs[@]}"
            D=$(release/image-digest.sh "${REPO}:${VERSION}" linux/amd64 linux/arm64)   # its own line: a failure fails the step
            echo "${img^^}_REF=${REPO}@${D}" >> "$GITHUB_ENV"
          done
          echo "SERVER_IMG=ghcr.io/${O}/mdmesh-server:${VERSION}" >> "$GITHUB_ENV"
          echo "WEB_IMG=ghcr.io/${O}/mdmesh-web:${VERSION}" >> "$GITHUB_ENV"
      - name: Verify images are publicly pullable (guards against private GHCR packages, #3)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          fail=0
          for img in mdmesh-server mdmesh-web mdmesh-supervisor; do
            # No credentials on purpose: this is exactly what the quickstart does on a fresh box.
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${O}/${img}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${O}/${img}/manifests/${VERSION}")
            echo "${img}:${VERSION} anonymous manifest -> ${code}"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = 1 ]; then
            echo "::error::At least one image is not anonymously pullable. Set the package visibility to Public" \
                 "(org → Packages → <image> → Package settings → Danger Zone) and re-run this job."
            exit 1
          fi

      # --- Manifest: build + sign ---
      # The manifest pins the three images by the index digests read back from GHCR right after each was tagged (*_REF
      # above), and the quick start's downloads by SHA-256 (release/build-manifest.sh). A 0.5.0+ supervisor and the quick
      # start run exactly those digests; the :VERSION tags stay in it for older supervisors.
      - name: Build + sign manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          CODE: ${{ needs.apk.outputs.code }}
          CK: ${{ needs.apk.outputs.ck }}
          PROTO: ${{ needs.apk.outputs.proto }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y minisign
          release/build-manifest.sh "$VERSION" stable \
            "$SERVER_IMG" "$WEB_IMG" mdmesh-agent.apk "$CODE" "$CK" "$PROTO" \
            "$SERVER_REF" "$WEB_REF" "$SUPERVISOR_REF"
          release/sign-manifest.sh manifest.json
      # The signed manifest's securityReleases (a supervisor reads them to warn an admin who would skip a security
      # release) must be exactly CHANGELOG.md's: every version up to this one with a Security section (RELEASING.md).
      - name: Signed manifest's securityReleases match CHANGELOG.md
        run: |
          release/security-releases.py --check manifest.json \
            || { echo "::error::manifest.json's securityReleases differ from CHANGELOG.md (details above; RELEASING.md)"; exit 1; }

      # --- Publish ---
      # The notes are the tag annotation, checked once more against CHANGELOG.md right before publishing, with the
      # same signature blocks stripped that the check ignores. Nothing else is added (generate_release_notes: false).
      - name: Release notes from the tag annotation
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --quiet origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          release/changelog-section.sh --check "$REF_NAME" "$GITHUB_SHA" \
            || { echo "::error::${REF_NAME} is not its CHANGELOG.md section on ${GITHUB_SHA} (details above; RELEASING.md)"; exit 1; }
          { git tag -l --format='%(contents)' "$REF_NAME" \
            | sed -E '/^-----BEGIN (PGP SIGNATURE|SSH SIGNATURE|SIGNED MESSAGE)-----/,$d'; } > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "::error::release notes for ${REF_NAME} came out empty"; exit 1; }
      # The quickstart.sh uploaded below must be exactly the file the signed manifest hashes: nothing in this job writes
      # it after the checkout, and this checks it right before the upload (the readback after it checks the asset).
      - name: quickstart.sh matches the signed manifest
        run: |
          want=$(python3 -c 'import json; print(json.load(open("manifest.json"))["files"]["quickstart.sh"])')
          got=$(sha256sum quickstart.sh | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::quickstart.sh is ${got}, but the signed manifest has ${want}"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          body_path: release-notes.md
          generate_release_notes: false
          # quickstart.sh is the tagged commit's copy: the README's checked install block downloads it from the latest
          # release and checks it against its SHA-256 in the signed manifest's files (build-manifest.sh).
          files: |
            mdmesh-agent.apk
            manifest.json
            manifest.json.minisig
            quickstart.sh

      # --- Read the published quickstart.sh back (README's install block downloads it) ---
      # A Release whose quickstart.sh isn't the file the signed manifest hashes must not get :latest.
      - name: Published quickstart.sh matches the signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$REF_NAME" -R "$GITHUB_REPOSITORY" -p quickstart.sh -D "$RUNNER_TEMP/readback" --clobber
          want=$(python3 -c 'import json; print(json.load(open("manifest.json"))["files"]["quickstart.sh"])')
          got=$(sha256sum "$RUNNER_TEMP/readback/quickstart.sh" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::the published quickstart.sh is ${got}, but the signed manifest has ${want}; :latest was not moved"; exit 1; }

      # --- Move :latest LAST, only once the release is pullable, signed and published ---
      # Quick-start installs (*_VERSION=latest, `docker compose pull`) follow :latest, so it must never point
      # at an image whose release failed. Retag registry-side from the already-pushed :VERSION (no rebuild, no
      # local state). --prefer-index=false re-pushes the source manifest as-is, so both tags share one digest — asserted
      # below. :VERSION is an index, which buildx copies as-is anyway; without the flag it would wrap a single-image
      # manifest (a :VERSION tagged by hand) in a NEW index with a different digest. Phased to keep a failure as early and
      # as all-or-nothing as possible: resolve all three :VERSION first, then move all three, then verify all.
      # A red job here leaves the Release published; recover by hand (RELEASING.md), don't re-run the job.
      - name: Move :latest to this release
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMGS="mdmesh-server mdmesh-web mdmesh-supervisor"
          digest() { docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"; }
          declare -A want
          for img in $IMGS; do
            d=$(digest "ghcr.io/${O}/${img}:${VERSION}") || d=""
            [ -n "$d" ] || { echo "::error::cannot resolve ghcr.io/${O}/${img}:${VERSION}; no :latest was moved"; exit 1; }
            # :VERSION must still be the digest the signed manifest pins (nothing re-pushed it since).
            signed=$(python3 -c 'import json,sys; print(json.load(open("manifest.json"))["components"]["images"][sys.argv[1]])' "${img#mdmesh-}")
            [ "$signed" = "ghcr.io/${O}/${img}@${d}" ] \
              || { echo "::error::ghcr.io/${O}/${img}:${VERSION} is ${d}, but the signed manifest pins ${signed}; no :latest was moved"; exit 1; }
            want[$img]=$d
          done
          for img in $IMGS; do
            docker buildx imagetools create --prefer-index=false \
              --tag "ghcr.io/${O}/${img}:latest" "ghcr.io/${O}/${img}:${VERSION}"
          done
          bad=0
          for img in $IMGS; do
            got=$(digest "ghcr.io/${O}/${img}:latest") || got=""
            echo "${img}: :${VERSION}=${want[$img]} :latest=${got}"
            if [ "$got" != "${want[$img]}" ]; then
              echo "::error::${img}:latest is '${got}', expected :${VERSION} digest '${want[$img]}'"; bad=1
            fi
          done
          [ "$bad" = 0 ]
