# T1 integration gate: the agent-v1 end-to-end suite (scripts/agent-v1-e2e.sh) against a REAL
# server + Postgres, on every PR that can change server behaviour and on push to main. T0
# (t0-fast.yml) stays DB-free and under 5 minutes; this tier owns everything that needs a running
# control plane. Target: under 10 minutes. The job timeout is 25: a cold server image build (no layer cache,
# as on a fresh hosted runner) has taken about 10.5 minutes on its own, before the first boot and the suite.
#
# It runs the dev loop of docs/DEV.md, not a CI-only one: the dev stack (docker-compose.yml, the
# production stack, + docker-compose.dev.yml via docker/dev.env) builds the server image from
# docker/server.Dockerfile and its own entrypoint configures it; scripts/dev-seed.sh seeds the database
# through the installers' install/lib/db.sh and sets the admin password through the real first-login
# reset; then the suite runs against the server's published API port.
name: t1-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  paths:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.cp.outputs.matched }}
      all: ${{ steps.cp.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: cp
        uses: ./.github/actions/ci-kit/changed-paths
        with:
          # Everything that goes into the server image, the dev stack, the DB provisioning, the wire contract, or the
          # suite itself. Listed explicitly: the kit's fail-closed **/Dockerfile* does not match
          # docker/server.Dockerfile (.github/** and docker-compose* fail closed anyway).
          filters: |
            e2e: pom.xml, common/**, jwt/**, notification/**, plugins/**, server/**, proto/**, install/**, docker/entrypoint.sh, docker/server.Dockerfile, .dockerignore, docker-compose.yml, docker-compose.dev.yml, docker/dev.env, scripts/dev-seed.sh, scripts/agent-v1-e2e.sh

  agent-e2e:
    name: agent-e2e
    needs: paths
    if: needs.paths.outputs.all == 'true' || fromJSON(needs.paths.outputs.matched).e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    # Shell variables override docker/dev.env (compose's rule). Per run, so concurrent runs on a daemon shared by
    # several runners (vars.CI_RUNNER) never share a project, its volumes, the server image tag or a host port: the
    # project name and image tag carry the run id, and port 0 publishes each loopback port on a free ephemeral port
    # (dev-seed.sh and the suite step ask compose which one).
    env:
      COMPOSE_PROJECT_NAME: mdmesh-t1-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_VERSION: t1-${{ github.run_id }}-${{ github.run_attempt }}
      DEV_API_PORT: "0"
      DEV_PG_PORT: "0"
      DEV_DEBUG_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build + start the dev stack's postgres + server
        # The suite talks to the API directly; caddy and supervisor are not needed (server depends only on postgres).
        run: docker compose --env-file docker/dev.env up -d --build postgres server

      - name: Seed (scripts/dev-seed.sh; waits for the first boot)
        run: |
          ADMIN_PW=$(openssl rand -hex 24)
          echo "::add-mask::$ADMIN_PW"
          echo "ADMIN_PW=$ADMIN_PW" >> "$GITHUB_ENV"
          DEV_ADMIN_PASSWORD=$ADMIN_PW scripts/dev-seed.sh

      - name: Agent v1 end-to-end suite
        run: |
          API=$(docker compose --env-file docker/dev.env port server 8080)
          scripts/agent-v1-e2e.sh "http://$API"

      - name: Collect logs
        if: failure() || cancelled()   # cancelled covers the job timeout
        run: |
          mkdir -p e2e-logs
          docker compose --env-file docker/dev.env ps -a > e2e-logs/ps.txt 2>&1 || true
          docker compose --env-file docker/dev.env logs --no-color --timestamps > e2e-logs/compose.log 2>&1 || true
          sid=$(docker compose --env-file docker/dev.env ps -aq server 2>/dev/null) || true
          [ -z "$sid" ] || docker cp "$sid":/usr/local/tomcat/logs e2e-logs/tomcat-logs || true
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: t1-e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        # Hosted runners are discarded anyway; this keeps a self-hosted CI_RUNNER clean. Removes this run's server
        # image by its tag only (never by id: an identical build can share its id with another tag).
        if: always()
        run: |
          img=$(docker compose --env-file docker/dev.env config --format json \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["services"]["server"]["image"])') || true
          docker compose --env-file docker/dev.env down -v --remove-orphans || true
          [ -z "$img" ] || docker rmi "$img" >/dev/null 2>&1 || true

  # A red T1 on main means main is broken for real devices: open/update one tracking issue.
  # PR failures are already visible on the PR, so they do not file issues.
  report:
    needs: agent-e2e
    if: failure() && github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/ci-kit/report-tier-failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tier: T1
          labels: ci-t1
