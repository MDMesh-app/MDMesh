# T1 integration gate: the agent-v1 end-to-end suite (scripts/agent-v1-e2e.sh) against a REAL
# server + Postgres, on every PR that can change server behaviour and on push to main. T0
# (t0-fast.yml) stays DB-free and under 5 minutes; this tier owns everything that needs a running
# control plane. Target: under 10 minutes. The job timeout is 25: a cold server image build (no layer cache,
# as on a fresh hosted runner) has taken about 10.5 minutes on its own, before the first boot and the suite.
#
# It runs the dev loop of docs/DEV.md, not a CI-only one: the dev stack (docker-compose.yml, the
# production stack, + docker-compose.dev.yml via docker/dev.env) builds the server image from
# docker/server.Dockerfile and its own entrypoint configures it; scripts/dev-seed.sh seeds the database
# through the installers' install/lib/db.sh and sets the admin password through the real first-login
# reset; then the suite runs against the server's published API port.
#
# A second job, lifecycle-e2e, runs the install lifecycle suites (tests/proxy-e2e, tests/rollback-e2e) when the
# installers, the edge, the updater or the compose files change. They build the images and run in docker:dind, so they
# take longer (up to about an hour) and are not part of the 10-minute target.
name: t1-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  paths:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.cp.outputs.matched }}
      all: ${{ steps.cp.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: cp
        uses: ./.github/actions/ci-kit/changed-paths
        with:
          # Everything that goes into the server image, the dev stack, the DB provisioning, the wire contract, or the
          # suite itself. Listed explicitly: the kit's fail-closed **/Dockerfile* does not match
          # docker/server.Dockerfile (.github/** and docker-compose* fail closed anyway).
          filters: |
            e2e: pom.xml, common/**, jwt/**, notification/**, plugins/**, server/**, proto/**, install/**, docker/entrypoint.sh, docker/server.Dockerfile, .dockerignore, docker-compose.yml, docker-compose.dev.yml, docker/dev.env, scripts/dev-seed.sh, scripts/agent-v1-e2e.sh, scripts/server-jvm-check.sh
            # The install lifecycle in docker:dind (tests/proxy-e2e, tests/rollback-e2e): the installers, the edge, the
            # updater, the compose files and the ready proxy configurations, the database migrations (rollback-e2e
            # rolls back across a schema change), the docs whose restore commands rollback-e2e runs as written, and the
            # tests themselves.
            lifecycle: quickstart.sh, setup.sh, install/**, docker/**, docker-compose*.yml, supervisor/**, docs/proxies/**, docs/OPERATIONS.md, docs/UPGRADING.md, **/src/main/resources/liquibase/**, tests/proxy-e2e/**, tests/rollback-e2e/**, tests/lib/dind-images.sh, .dockerignore

  agent-e2e:
    name: agent-e2e
    needs: paths
    if: needs.paths.outputs.all == 'true' || fromJSON(needs.paths.outputs.matched).e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    # Shell variables override docker/dev.env (compose's rule). Per run, so concurrent runs on a daemon shared by
    # several runners (vars.CI_RUNNER) never share a project, its volumes, the server image tag or a host port: the
    # project name and image tag carry the run id, and port 0 publishes each loopback port on a free ephemeral port
    # (dev-seed.sh and the suite step ask compose which one).
    env:
      COMPOSE_PROJECT_NAME: mdmesh-t1-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_VERSION: t1-${{ github.run_id }}-${{ github.run_attempt }}
      DEV_API_PORT: "0"
      DEV_PG_PORT: "0"
      DEV_DEBUG_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build + start the dev stack's postgres + server
        # The suite talks to the API directly; caddy and supervisor are not needed (server depends only on postgres).
        run: docker compose --env-file docker/dev.env up -d --build postgres server

      # The dev stack sets CATALINA_OPTS (the debugger agent): -XX:-UseBASE64Intrinsics (install/tomcat-setenv.sh) must
      # still be in effect, as with a deployment's SERVER_JAVA_OPTS. release.yml checks the published image the same way.
      # Then the image on its own, as release.yml checks each platform's build before tagging it, with JAVA_OPTS asking for
      # -XX:+UseBASE64Intrinsics: a deployment's SERVER_JAVA_OPTS can't turn the code back on.
      - name: Server JVM runs with -XX:-UseBASE64Intrinsics (CVE-2026-114938, OpenJDK)
        run: |
          scripts/server-jvm-check.sh --container "$(docker compose --env-file docker/dev.env ps -q server)"
          img=$(docker compose --env-file docker/dev.env config --format json \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["services"]["server"]["image"])')
          scripts/server-jvm-check.sh --image "$img"

      - name: Seed (scripts/dev-seed.sh; waits for the first boot)
        run: |
          ADMIN_PW=$(openssl rand -hex 24)
          echo "::add-mask::$ADMIN_PW"
          echo "ADMIN_PW=$ADMIN_PW" >> "$GITHUB_ENV"
          DEV_ADMIN_PASSWORD=$ADMIN_PW scripts/dev-seed.sh

      - name: Agent v1 end-to-end suite
        run: |
          API=$(docker compose --env-file docker/dev.env port server 8080)
          scripts/agent-v1-e2e.sh "http://$API"

      # A database whose settings still say twoFactor (carried over from Headwind): the column is put back as true, its
      # drop forgotten, and the server restarted. The drop runs again; the console and the API sign in. Before the drop,
      # the console's first request after sign-in and every API sign-in were refused.
      - name: Sign-in with a carried-over two-factor setting
        run: |
          DC=(docker compose --env-file docker/dev.env)
          PSQL=("${DC[@]}" exec -T postgres psql -U mdmesh -d mdmesh -v ON_ERROR_STOP=1 -tA)
          "${PSQL[@]}" -c "ALTER TABLE settings ADD COLUMN twoFactor BOOLEAN NOT NULL DEFAULT false" \
            -c "DELETE FROM databasechangelog WHERE id = '26.11.23-settings-twoFactor-drop'"
          set_rows=$("${PSQL[@]}" -c "WITH s AS (UPDATE settings SET twoFactor = true RETURNING 1) SELECT count(*) FROM s")
          [ "$set_rows" -gt 0 ] || { echo "::error::no settings row to set twoFactor on"; exit 1; }
          "${DC[@]}" restart server
          API="http://$("${DC[@]}" port server 8080)"
          up=
          for _ in $(seq 1 36); do
            curl -fs -o "$RUNNER_TEMP/options" -m 5 "$API/rest/public/auth/options" && { up=1; break; }
            sleep 5
          done
          [ -n "$up" ] || { echo "::error::the server didn't come back within 3 minutes of its restart"; exit 1; }
          test "$("${PSQL[@]}" -c "SELECT count(*) FROM information_schema.columns
            WHERE table_name = 'settings' AND column_name = 'twofactor'")" = 0
          MD5=$(printf '%s' "$ADMIN_PW" | md5sum | awk '{print toupper($1)}')
          BODY="{\"login\":\"admin\",\"password\":\"$MD5\"}"
          curl -fsS -c "$RUNNER_TEMP/cj" -H 'Content-Type: application/json' -d "$BODY" -o "$RUNNER_TEMP/login" \
            "$API/rest/public/auth/login"
          grep -q '"status":"OK"' "$RUNNER_TEMP/login"
          curl -fsS -b "$RUNNER_TEMP/cj" -o "$RUNNER_TEMP/console" "$API/rest/private/users/current"
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d "$BODY" "$API/rest/public/jwt/login" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" -o "$RUNNER_TEMP/api" "$API/rest/private/users/current"

      - name: Collect logs
        if: failure() || cancelled()   # cancelled covers the job timeout
        run: |
          mkdir -p e2e-logs
          docker compose --env-file docker/dev.env ps -a > e2e-logs/ps.txt 2>&1 || true
          docker compose --env-file docker/dev.env logs --no-color --timestamps > e2e-logs/compose.log 2>&1 || true
          sid=$(docker compose --env-file docker/dev.env ps -aq server 2>/dev/null) || true
          [ -z "$sid" ] || docker cp "$sid":/usr/local/tomcat/logs e2e-logs/tomcat-logs || true
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: t1-e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        # Hosted runners are discarded anyway; this keeps a self-hosted CI_RUNNER clean. Removes this run's server
        # image by its tag only (never by id: an identical build can share its id with another tag).
        if: always()
        run: |
          img=$(docker compose --env-file docker/dev.env config --format json \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["services"]["server"]["image"])') || true
          docker compose --env-file docker/dev.env down -v --remove-orphans || true
          [ -z "$img" ] || docker rmi "$img" >/dev/null 2>&1 || true

  # The install lifecycle end to end, each suite in its own privileged docker:dind with a registry that answers as
  # ghcr.io (nothing reaches the runner's own stacks). Images are built from this checkout (and, for rollback-e2e, from
  # origin/main), tagged per run and suite.
  #   proxy-e2e     behind your own proxy: docs/proxies' nginx, Apache, Caddy and Traefik in front; sign-in, client
  #                 address, wake socket, uploads, the HTTPS origin; update and Roll back keep the mode.
  #   rollback-e2e  updates and rollbacks across a schema change: from v0.4.0 (its published images), from origin/main,
  #                 and the by-hand restores the docs give.
  lifecycle-e2e:
    name: ${{ matrix.suite }}
    needs: paths
    if: needs.paths.outputs.all == 'true' || fromJSON(needs.paths.outputs.matched).lifecycle
    # Always a GitHub-hosted runner, never vars.CI_RUNNER: the suites run --privileged containers (docker:dind), which
    # must not land on a self-hosted machine from a pull request. Each matrix entry gets its own VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [proxy-e2e, rollback-e2e]
    env:
      E2E_NEW_TAG: ci-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_OLD_TAG: ci-main-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PREFIX: ${{ matrix.suite == 'proxy-e2e' && 'px' || 'rr' }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # rollback-e2e reads v0.4.0's files (git archive) and builds origin/main
      - name: Free disk space (the runner's preinstalled toolchains)
        # rollback-e2e builds six images, pulls five more, and copies them all into docker:dind and its registry: more
        # than a hosted runner has free. These toolchains are unused here.
        run: |
          df -h / /var/lib/docker || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The Maven repository T0's server entry (setup-java, cache: maven) saved for these poms; the server image builds
      # start from it. Restore only: no Maven runs on this runner, so a save from here would be empty, under T0's key.
      # The path is T0's as written there (it is part of the cache's identity). No entry: an empty directory, and Maven
      # downloads everything.
      - name: Empty Maven repository
        run: mkdir -p /home/runner/.m2/repository
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
      # build TAG CONTEXT: the three images, quietly; one that fails is built once more, a minute later, with its output
      # shown, so the cause is in the log (a download that failed, say Maven Central's 429 to a busy runner address, goes
      # through then; a real error shows).
      - name: Build this checkout's images
        run: |
          build() {
            for n in server web supervisor; do
              docker build -q --build-context m2=/home/runner/.m2/repository \
                -f "$2/docker/$n.Dockerfile" -t "ghcr.io/local/mdmesh-$n:$1" "$2" \
                || { echo "::warning::the $n image failed to build; once more in a minute, with its output"; sleep 60
                     docker build --progress=plain --build-context m2=/home/runner/.m2/repository \
                       -f "$2/docker/$n.Dockerfile" -t "ghcr.io/local/mdmesh-$n:$1" "$2"; }
            done
          }
          declare -f build > "$RUNNER_TEMP/build.sh"
          build "$E2E_NEW_TAG" .
      - name: Build origin/main's images (rollback-e2e's older release)
        if: matrix.suite == 'rollback-e2e'
        run: |
          git fetch -q --tags origin main
          git worktree add -q "$RUNNER_TEMP/main" origin/main
          . "$RUNNER_TEMP/build.sh"
          build "$E2E_OLD_TAG" "$RUNNER_TEMP/main"
          docker builder prune -f >/dev/null   # the two builds' cache (Maven, npm); the images stay
          df -h /
      - name: Pull the images the suite loads into its docker:dind
        run: |
          caddy=$(awk 'tolower($1) == "from" && $2 ~ /^caddy[:@]/ { print $2; exit }' docker/web.Dockerfile)
          ROOT=$PWD; . tests/lib/dind-images.sh
          pg=$(pinned_image postgres)
          if [ "${{ matrix.suite }}" = proxy-e2e ]; then
            imgs="$pg nginx:1.26-alpine httpd:2.4-alpine $caddy"
          else
            imgs="$pg postgres:14 postgres:16 ghcr.io/mdmesh-app/mdmesh-server:0.4.0 ghcr.io/mdmesh-app/mdmesh-web:0.4.0 ghcr.io/mdmesh-app/mdmesh-supervisor:0.4.0"
          fi
          for i in $imgs; do docker pull -q "$i"; done
          df -h /
      # The work directory (docker.log, each step's output; proxy-e2e adds the stack's own logs on a failure) is kept
      # (E2E_KEEP=1) and uploaded when the suite fails, so a failure can be read without another long run.
      - name: Run tests/${{ matrix.suite }}
        env:
          E2E_DATA_DIR: ${{ runner.temp }}/e2e-data
          E2E_KEEP: "1"
          TMPDIR: ${{ runner.temp }}/e2e-work
        run: |
          mkdir -p "$TMPDIR"
          tests/${{ matrix.suite }}/run.sh
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.suite }}-work
          path: ${{ runner.temp }}/e2e-work/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this run's images
        # By tag only (never by id: an identical build can share its id with another tag).
        if: always()
        run: |
          for n in server web supervisor; do
            docker rmi "ghcr.io/local/mdmesh-$n:$E2E_NEW_TAG" "ghcr.io/local/mdmesh-$n:$E2E_OLD_TAG" >/dev/null 2>&1 || true
          done

  # A red T1 on main means main is broken for real devices: open/update one tracking issue.
  # PR failures are already visible on the PR, so they do not file issues.
  report:
    needs: [agent-e2e, lifecycle-e2e]
    if: failure() && github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/ci-kit/report-tier-failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tier: T1
          labels: ci-t1
