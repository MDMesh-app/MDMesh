# T2 native gate: install and upgrade MDMesh NATIVELY (DEPLOY.md Option C, `sudo ./setup.sh --native -y`; no Docker
# for MDMesh itself) inside throwaway systemd containers that look like a fresh VPS, on Debian 12, Debian 13 and
# Ubuntu 24.04, with tests/native/run.sh (docs/DEV.md, "T2 native rig"):
#   fresh    the change on a clean host
#   upgrade  the latest GitHub release, then the change over it, with continuity checks (a device enrolled before the
#            upgrade checks in after it with its original secret; hash.secret / jwt.secretkey and the data unchanged)
#   killed   the same upgrade SIGKILLed at each kill point, then re-run: it must converge
#   update   the change installed, then `sudo ./setup.sh --update --native` over it without -y: it must ask nothing
#   update-resumed  the same after an update that stopped halfway (clone already moved, "no" at the question): it must
#            say the install is unchanged, then name the installed release as the one it updates from (Debian 12 only,
#            unless a distro is chosen)
# Every install is followed by the same check step: units active, initialized.txt OK, /rest/public/name 200, and that
# version's scripts/agent-v1-e2e.sh with FAIL=0.
#
# Runs on pull requests that touch the installers, the rig or a pom.xml, nightly on main, and by hand (one distro /
# scenario / from-ref). Slow by nature (a full JDK + Postgres + Maven + npm install per container), so it is its own
# tier and is not part of T0/T1.
name: t2-native

on:
  pull_request:
    paths:
      - install/**
      - setup.sh
      - supervisor/mode-guard.sh
      - quickstart.sh
      - tests/native/**
      - "**/pom.xml"  # what the distros' own Maven builds
      - .github/workflows/t2-native.yml
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      distro:
        description: Distro to run (all = the whole matrix)
        type: choice
        options: [all, debian-12, debian-13, ubuntu-24.04]
        default: all
      scenario:
        description: Scenario to run (all = the whole matrix)
        type: choice
        options: [all, fresh, upgrade, killed, update, update-resumed]
        default: all
      from-ref:
        description: Release to upgrade from (empty = the latest GitHub release).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      from-ref: ${{ steps.plan.outputs.from-ref }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IN_DISTRO: ${{ inputs.distro || 'all' }}
          IN_SCENARIO: ${{ inputs.scenario || 'all' }}
          IN_FROM: ${{ inputs.from-ref }}
        run: |
          # The release to upgrade from: the input, else the latest GitHub release (not the newest git tag).
          from=$IN_FROM
          if [ -z "$from" ]; then from=$(gh release view --repo "$REPO" --json tagName --jq .tagName); fi
          case "$from" in v[0-9]*) ;; *) echo "::error::could not resolve the release to upgrade from (got '$from')"; exit 1 ;; esac
          echo "from-ref=$from" >> "$GITHUB_OUTPUT"
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          d, s = os.environ["IN_DISTRO"], os.environ["IN_SCENARIO"]
          distros = ["debian-12", "debian-13", "ubuntu-24.04"] if d == "all" else [d]
          scenarios = ["fresh", "upgrade", "killed", "update", "update-resumed"] if s == "all" else [s]
          # update-resumed adds only distro-independent steps to update (git, the installer's question and its text): one
          # distro covers it, unless a run names its distro.
          jobs = [{"distro": x, "scenario": y} for x in distros for y in scenarios
                  if y != "update-resumed" or d != "all" or x == "debian-12"]
          # One killed job keeps upgrading from v0.5.1, the last release without the installed-version record: only
          # from such a release does it check the installer's early record write (tests/native/run.sh, killed).
          # A run that names a from-ref or a distro uses what it names.
          if not os.environ["IN_FROM"] and d == "all":
              for j in jobs:
                  if j["scenario"] == "killed" and j["distro"] == "debian-12":
                      j["from-ref"] = "v0.5.1"
          print("matrix=" + json.dumps({"include": jobs}))
          EOF
          echo "upgrading from $from"

  native:
    name: ${{ matrix.distro }} / ${{ matrix.scenario }}
    needs: plan
    # Always a GitHub-hosted runner, never vars.CI_RUNNER: the rig runs --privileged containers, which must not land on
    # a self-hosted machine from a pull request.
    runs-on: ubuntu-24.04
    # Locally (4 cores) fresh and upgrade take 3-5 min and killed about 20 (one install, then an upgrade + re-run per
    # kill point); the bounds leave room for a slower runner and cold downloads.
    timeout-minutes: ${{ matrix.scenario == 'killed' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # The Ubuntu guest's apt mirror (tests/native/Dockerfile): Azure's, next to the runner, as on an Azure VM. The public
      # archive alone has been slow enough to run ubuntu-24.04's fresh/update/upgrade into the 45-minute timeout.
      MDMESH_TEST_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
      T2_FROM_REF: ${{ matrix.from-ref || needs.plan.outputs.from-ref }}
      DISTRO: ${{ matrix.distro }}
      SCENARIO: ${{ matrix.scenario }}
      M2_BUILD: >-
        ${{ (matrix.scenario == 'fresh' || matrix.scenario == 'update') && 'head'
            || format('from-{0}', needs.plan.outputs.from-ref) }}
      # The one cell that installs without the Maven cache (see "Restore the guest's Maven repository").
      M2_COLD: ${{ github.event_name == 'schedule' && matrix.distro == 'debian-13' && matrix.scenario == 'fresh' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags: the rig bundles the release and the change, and the installers read the version
          # with `git describe`.
          fetch-depth: 0
          fetch-tags: true

      # The guest's Maven repository (T2_M2_REPO in tests/native/run.sh): Maven Central rate-limits the runners' shared
      # IPs (HTTP 429) for longer than Maven's own back-off waits, so the rig seeds the guest from this cache and saves
      # the guest's repository after a converged install. One entry per distro (their Maven versions differ) and build:
      # fresh and update build the change only ("head"), upgrade and killed also build the release ("from-<release>").
      # A new key (a pom change, a release) starts from the closest earlier entry, and is uploaded only when the rig
      # saved (the marker <dir>.t2-saved). Pull requests start from main's entries, which the nightly run and manual
      # runs on main write: after a pom change or a release, a manual run on main primes them. The nightly
      # debian-13 / fresh cell installs cold, as a new VPS does, to catch a dependency gone from its repository.
      - name: Restore the guest's Maven repository
        id: m2
        if: env.M2_COLD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/t2-m2
          key: t2-m2-${{ matrix.distro }}-${{ env.M2_BUILD }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            t2-m2-${{ matrix.distro }}-${{ env.M2_BUILD }}-
            t2-m2-${{ matrix.distro }}-

      - name: Run the rig
        id: rig
        env:
          T2_OUT: ${{ runner.temp }}/t2-out
          T2_M2_REPO: ${{ env.M2_COLD != 'true' && format('{0}/t2-m2', runner.temp) || '' }}
          # An exact hit holds what this build needs already: skip the copy-out.
          T2_M2_SAVE: ${{ steps.m2.outputs.cache-hit == 'true' && '0' || '1' }}
        run: |
          tests/native/run.sh "$DISTRO" "$SCENARIO"
          if [ -n "$T2_M2_REPO" ] && [ -e "$T2_M2_REPO.t2-saved" ]; then echo "m2-saved=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the guest's Maven repository
        if: steps.rig.outputs.m2-saved == 'true' && steps.m2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/t2-m2
          key: ${{ steps.m2.outputs.cache-primary-key }}

      - name: Summary
        if: always()
        env:
          T2_OUT: ${{ runner.temp }}/t2-out
        run: |
          f=$(find "$T2_OUT" -name results.tsv 2>/dev/null | head -n 1) || true
          {
            echo "### T2 native: $DISTRO / $SCENARIO (from $T2_FROM_REF)"
            echo
            echo "| distro | scenario | kill point | verdict | detail |"
            echo "|---|---|---|---|---|"
            [ -z "$f" ] || sed 's/|/\\|/g; s/\t/ | /g; s/^/| /; s/$/ |/' "$f"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: t2-native-${{ matrix.distro }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/t2-out/
          retention-days: 7
          if-no-files-found: warn
