# Additions to detekt's default rules (build.gradle.kts: buildUponDefaultConfig).
style:
  ForbiddenImport:
    active: true
    imports:
      # #220: every DataStore file is opened by AgentDataStores, once, with its corruption handler and mirror. A
      # delegate opens one without either (and a second instance on a file fails every read).
      - value: 'androidx.datastore.preferences.preferencesDataStore'
        reason: 'Open DataStore files through com.mdmesh.core.store.AgentDataStores'
      - value: 'androidx.datastore.preferences.core.PreferenceDataStoreFactory'
        reason: 'Open DataStore files through com.mdmesh.core.store.AgentDataStores'
