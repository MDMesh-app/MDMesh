# Project-wide Gradle settings.

# JVM args for the Gradle daemon. Bump heap for a multi-module Android build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build cache + parallel + configuration cache for faster incremental CI builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory for modern AndroidX libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources/BuildConfig fields we actually declare.
android.nonTransitiveRClass=true

# Disable the unused Jetifier (no legacy support libs in this scaffold).
android.enableJetifier=false

# Lint on K1 UAST. AGP 8.6 switches lint to K2 UAST by itself for Kotlin 2.x, and its bundled K2 analyser crashes
# intermittently ("Unexpected failure during lint analysis", FirRegularClassImpl RAW_FIR to SUPER_TYPES, seen on
# app/src/test files). Remove after AGP 8.7+, whose bundled Analysis API carries the lazy-resolve fixes.
android.lint.useK2Uast=false
