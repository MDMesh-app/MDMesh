# Dev environment for the control plane (Postgres + Tomcat server).
# A lightweight dev stack; for a real host install use ./setup.sh (Docker) or ./setup.sh --native.
# Usage and the post-start seeding step are documented in docs/DEV.md.

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: mdmesh
      POSTGRES_USER: mdmesh
      POSTGRES_PASSWORD: mdmesh
    ports:
      # Override when a host PostgreSQL instance already uses 5432, e.g.
      # MDMESH_DEV_POSTGRES_PORT=15432 docker compose -f docker-compose.dev.yml up.
      - "${MDMESH_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL seed scripts mounted read-only; run manually AFTER first startup
      # (they UPDATE rows Liquibase creates at app boot — not an initdb script).
      - ./install/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdmesh -d mdmesh"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Override together with MDMESH_DEV_BASE_URL when 8080 is occupied.
      - "${MDMESH_DEV_HTTP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mdmesh
      DB_USER: mdmesh
      DB_PASSWORD: mdmesh
      # These deliberately unsafe, fixed values are for the disposable development stack only.
      BASE_URL: ${MDMESH_DEV_BASE_URL:-http://localhost:8080}
      HASH_SECRET: ${MDMESH_DEV_HASH_SECRET:-mdmesh-development-only-secret}
      SECURE_ENROLLMENT: "0"
    # 31000 is the embedded MQTT broker; expose if you want devices to reach it directly.
    # - "31000:31000"

volumes:
  pgdata:
