# Own-domain overlay: publish the edge on 80/443 so Caddy can serve traffic and auto-provision a
# Let's Encrypt cert for SITE_ADDRESS. Use it with the main compose file:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.domain.yml   (in .env, so the updater's compose keeps it too)
# (Not used in Cloudflare-tunnel mode, where nothing is published.)

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
