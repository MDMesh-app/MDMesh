# Pull-only MDMesh stack — no build context, every service runs a published GHCR image. This is the
# "no clone, no build" deploy. Easiest via quickstart.sh, or by hand:
#
#   curl -fsSLO https://raw.githubusercontent.com/MDMesh-app/MDMesh/refs/tags/vX.Y.Z/docker-compose.release.yml   # the release you run
#   # write a .env (DB_PASSWORD, HASH_SECRET, BASE_URL, IMAGE_OWNER, …) — see quickstart.sh — with the mode in it:
#   #   COMPOSE_FILE=docker-compose.release.yml and COMPOSE_PROFILES=cloudflare          # tunnel
#   #   COMPOSE_FILE=docker-compose.release.yml:docker-compose.domain.yml                # own domain
#   #   COMPOSE_FILE=docker-compose.release.yml:docker-compose.proxy.yml                 # behind your own proxy
#   # (not with -f and --profile: they don't reach the supervisor, whose updates and rollbacks then use another list,
#   # nor caddy, which then won't believe cloudflared's CF-Connecting-IP: docker/edge-peers.sh)
#   docker compose up -d
#
# Pin SERVER_VERSION/WEB_VERSION/SUPERVISOR_VERSION in .env for production; they default to :latest. The quick start
# and every update pin them by digest from the signed release manifest (0.5.0@sha256:…: docker pulls by the digest).
services:
  postgres:
    # PostgreSQL 18. From 18 the image keeps the cluster in /var/lib/postgresql/18/docker, so the volume (pgdata18)
    # mounts on /var/lib/postgresql. pgdata is the PostgreSQL 14 volume of installs from before 0.6.0: it is mounted
    # read-only only so the entrypoint below refuses to start an empty 18 cluster next to it (the server would then
    # create a new, empty database). Such an install moves its data once with scripts/pg-upgrade-18.sh
    # (docs/UPGRADING.md, PostgreSQL 18). On a new install pgdata stays empty.
    # tag@sha256:<index digest>, the same in both compose files; Dependabot bumps both. The major (a data format) and
    # the Debian release (text sort order) change only in a planned database migration.
    image: postgres:18.7-trixie@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    entrypoint:
      - sh
      - -c
      - |
        if [ -s /var/lib/mdmesh-pg14/PG_VERSION ] && [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "MDMesh: the database is still in PostgreSQL $$(cat /var/lib/mdmesh-pg14/PG_VERSION) format (volume pgdata). Not starting an empty PostgreSQL 18 database next to it: run scripts/pg-upgrade-18.sh in the install directory (docs/UPGRADING.md, PostgreSQL 18)." >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - pg-guard
    command: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mdmesh}
      POSTGRES_USER: ${DB_USER:-mdmesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata18:/var/lib/postgresql
      - pgdata:/var/lib/mdmesh-pg14:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mdmesh} -d ${DB_NAME:-mdmesh}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-server:${SERVER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mdmesh}
      DB_USER: ${DB_USER:-mdmesh}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      HASH_SECRET: ${HASH_SECRET:?set HASH_SECRET in .env}
      # Optional; unset = the key the server keeps in its volume. Prefixed .env key for the reason given at JAVA_OPTS.
      JWT_SECRET: ${SERVER_JWT_SECRET:-}
      SECURE_ENROLLMENT: ${SECURE_ENROLLMENT:-0}
      LEGACY_DEVICE_API: ${LEGACY_DEVICE_API:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-mdm@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Optional JVM flags, e.g. a temporary DEBUG log config (docs/OPERATIONS.md "Server logs"). Read from the
      # prefixed .env key: compose lets the shell override .env, and a generic JAVA_OPTS exported on a Java host must
      # not reach the server.
      JAVA_OPTS: ${SERVER_JAVA_OPTS:-}
    volumes:
      - mdmeshdata:/opt/mdmesh

  caddy:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-web:${WEB_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
      - supervisor
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # The hosting mode: in tunnel mode (cloudflare) the edge believes cloudflared's CF-Connecting-IP
      # (docker/edge-peers.sh).
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Proxies in front of the edge (a CDN, a load balancer) whose X-Forwarded-For it believes, as space-separated
      # CIDRs; set in .env. Unset or empty: none (docs/OPERATIONS.md, Sign-in limits).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Your own edge rules (DEPLOY.md, "Your own edge rules"): .env's MDMESH_SITE_DIR, the install directory's site.d
      # as an absolute path (so the updater's compose, run from inside its container, mounts the same directory).
      # Unset: an empty volume.
      - ${MDMESH_SITE_DIR:-caddy_site}:/etc/caddy/site.d:ro

  supervisor:
    image: ghcr.io/${IMAGE_OWNER:-mdmesh-app}/mdmesh-supervisor:${SUPERVISOR_VERSION:-latest}
    restart: unless-stopped
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      POLL_INTERVAL_HOURS: ${POLL_INTERVAL_HOURS:-6}
      # Seconds (at least 30) a new server gets to answer before an update is rolled back. apply.sh reads it from .env
      # too, so a value set there counts without recreating the supervisor (docs/OPERATIONS.md).
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-180}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CURRENT_VERSION: ${CURRENT_VERSION:-0.0.0}
      AUTO_UPDATE: ${AUTO_UPDATE:-0}
      # Set 0 to hide one-click apply (the console then shows the manual upgrade steps).
      APPLY_SUPPORTED: ${APPLY_SUPPORTED:-1}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mdmesh}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      DB_USER: ${DB_USER:-mdmesh}
      DB_NAME: ${DB_NAME:-mdmesh}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      - backups:/backups

  cloudflared:
    # Pinned like postgres. Cloudflare supports releases up to a year old; quick starts keep this line
    # (docs/UPGRADING.md).
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    restart: unless-stopped
    profiles: ["cloudflare"]
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata18:
  pgdata:     # PostgreSQL 14 data of installs from before 0.6.0, kept until removed by hand (docs/UPGRADING.md)
  mdmeshdata:
  caddy_data:
  caddy_config:
  caddy_site:
  backups:
