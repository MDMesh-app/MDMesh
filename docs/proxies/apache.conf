# MDMesh behind Apache httpd 2.4.47 or later (DEPLOY.md, "Behind your own proxy"). Apache does HTTPS and forwards
# everything to MDMesh's edge. Needs mod_ssl, mod_proxy, mod_proxy_http, mod_headers and mod_rewrite (Debian:
# a2enmod ssl proxy proxy_http headers rewrite). Replace mdm.example.com, the certificate paths and, if you changed
# MDMESH_BIND, 127.0.0.1:8080; then apachectl configtest && systemctl reload apache2.
# MDMesh's .env: TRUSTED_PROXIES="host" (Apache on this machine).
<VirtualHost *:80>
    ServerName mdm.example.com
    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mdm.example.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mdm.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mdm.example.com/privkey.pem

    # The path goes on as the client sent it (nocanon below, encoded slashes not decoded), so MDMesh's own path checks
    # see what the client sent.
    AllowEncodedSlashes NoDecode
    # App uploads: APKs up to 500 MB (no limit here; MDMesh streams them).
    LimitRequestBody 0

    ProxyPreserveHost On
    ProxyRequests Off
    # Who the client is: mod_proxy adds the address Apache sees to X-Forwarded-For (after anything the client sent;
    # MDMesh reads the list from the right and believes it from TRUSTED_PROXIES only).
    RequestHeader set X-Forwarded-Proto "https"
    # upgrade=websocket: the agent's wake socket (/agent/ws/); timeout: it stays open while idle (the agent pings every
    # 50 s), and long uploads aren't cut off.
    ProxyPass        / http://127.0.0.1:8080/ nocanon upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:8080/

    # MDMesh on another machine with MDMESH_ORIGIN_TLS=1: HTTPS to it, checked against MDMesh's own CA (docker compose
    # cp caddy:/data/caddy/pki/authorities/local/root.crt ./mdmesh-origin-ca.crt). Instead of the two lines above
    # (192.0.2.20:8080 is MDMESH_BIND there; ProxyPreserveHost sends the name mdm.example.com, which the certificate
    # has). Without SSLProxyVerify require Apache accepts any certificate (its default is none); the depth of 2 is
    # MDMesh's chain (its CA's root, then an intermediate).
    # SSLProxyEngine on
    # SSLProxyVerify require
    # SSLProxyVerifyDepth 2
    # SSLProxyCheckPeerName on
    # SSLProxyCACertificateFile /etc/apache2/mdmesh-origin-ca.crt
    # ProxyPass        / https://192.0.2.20:8080/ nocanon upgrade=websocket timeout=3600
    # ProxyPassReverse / https://192.0.2.20:8080/
</VirtualHost>
