# MDMesh behind nginx (DEPLOY.md, "Behind your own proxy"). nginx does HTTPS and forwards everything to MDMesh's edge,
# which does the rest: routing, security headers, path checks, the recovery page. Put it in /etc/nginx/conf.d/ (or
# sites-available/, linked from sites-enabled/), replace mdm.example.com, the certificate paths and, if you changed
# MDMESH_BIND, 127.0.0.1:8080, then: nginx -t && systemctl reload nginx.
# MDMesh's .env: TRUSTED_PROXIES="host" (nginx on this machine). tests/proxy-e2e runs this file as it is, with only
# those placeholders replaced; scripts/edge-check.sh runs its HTTPS-origin lines, with MDMesh's CA and with another.

# WebSocket upgrades (the agent's wake socket, /agent/ws/) only when the client asks for one.
map $http_upgrade $mdmesh_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mdm.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `http2` on the listen line works on every nginx the distributions ship (Debian 12: 1.22, Ubuntu 24.04: 1.24);
    # nginx 1.25.1 and later warn that it is deprecated in favour of `http2 on;`, which older ones refuse.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mdm.example.com;

    # From certbot (certbot certonly --nginx -d mdm.example.com), or any certificate for the name.
    ssl_certificate     /etc/letsencrypt/live/mdm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdm.example.com/privkey.pem;

    # App uploads in the console: APKs up to 500 MB, streamed to MDMesh as they arrive.
    client_max_body_size 600m;
    proxy_request_buffering off;

    location / {
        # No path after the address: the path reaches MDMesh exactly as the client sent it, so MDMesh's own path
        # checks see what the client sent (a path here would make nginx decode and normalise it first).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Who the client is: the address nginx sees, never what the client sent. MDMesh believes this header from
        # TRUSTED_PROXIES only.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent's wake socket stays open while idle (the agent pings every 50 s), and long requests (an APK
        # upload on a slow link) aren't cut off.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mdmesh_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # MDMesh on another machine with MDMESH_ORIGIN_TLS=1: HTTPS to it, checked against MDMesh's own CA
        # (docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt ./mdmesh-origin-ca.crt, then copy it
        # here). Use these lines instead of the proxy_pass above (192.0.2.20:8080 is MDMESH_BIND on that machine):
        # proxy_pass https://192.0.2.20:8080;
        # proxy_ssl_server_name on;
        # proxy_ssl_name mdm.example.com;
        # proxy_ssl_verify on;
        # proxy_ssl_trusted_certificate /etc/nginx/mdmesh-origin-ca.crt;
    }
}
