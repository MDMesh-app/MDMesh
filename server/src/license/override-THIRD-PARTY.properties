# groupId--artifactId--version=SPDX id. license-maven-plugin reads it from here (server/pom.xml). Keyed by version, so a
# new version of one of these needs its line updated; the build's licence check names the dependency when it does.
# docs/licenses/policy.md records why each election is made.

